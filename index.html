<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>東京 7天6夜行程(11月初)</title>
<style>
:root{
  --bg:#f4f4f0; --card:#ffffff; --border:#e8e8e0; --text:#1a1a1a; --sub:#888888;
  --accent:#1D9E75; --accent-bg:#eafaf3; --transit:#3a6fb0; --transit-bg:#eaf1fb;
  --pending:#b8860b; --pending-bg:#fff8e6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181a; --card:#212426; --border:#33373a; --text:#eaeaea; --sub:#9a9a9a;
    --accent:#3ecb96; --accent-bg:#1c2e27; --transit:#6ea8e8; --transit-bg:#1c2735;
    --pending:#e0c368; --pending-bg:#332c14;
  }
}
:root[data-theme="dark"]{
  --bg:#16181a; --card:#212426; --border:#33373a; --text:#eaeaea; --sub:#9a9a9a;
  --accent:#3ecb96; --accent-bg:#1c2e27; --transit:#6ea8e8; --transit-bg:#1c2735;
  --pending:#e0c368; --pending-bg:#332c14;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:24px}
.header{background:var(--card);text-align:center;padding:20px 16px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.header h1{font-size:19px;font-weight:700}
.header p{font-size:12px;color:var(--sub);margin-top:4px}
.day-tab{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);scrollbar-width:none;position:sticky;top:66px;z-index:19}
.day-tab::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);font-size:13px;font-weight:600;background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap;font-family:inherit}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.day-panel{display:none;padding:16px;max-width:640px;margin:0 auto}
.day-panel.active{display:block}
.day-title{font-size:18px;font-weight:700;margin-bottom:2px}
.day-sub{font-size:12px;color:var(--sub);margin-bottom:12px}
.meal-grid{display:flex;gap:8px;margin-bottom:14px}
.meal-cell{flex:1;border-radius:10px;padding:8px 10px;border:1px solid var(--border);background:var(--card)}
.meal-cell.pending{background:var(--pending-bg);border-color:var(--pending)}
.meal-label{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:0.5px}
.meal-value{font-size:12px;margin-top:3px;line-height:1.4;font-weight:600}
.meal-cell.pending .meal-value{color:var(--pending);font-weight:600}
.stop{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.stop-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stop-name{font-size:15px;font-weight:700}
.stop-time{font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}
.stop-blurb{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.stop-actions{margin-top:8px}
.map-btn{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:16px;padding:3px 10px;text-decoration:none}
.transit{display:flex;align-items:flex-start;gap:8px;margin:6px 4px 8px 4px;padding:7px 10px;background:var(--transit-bg);border-radius:8px;font-size:12px;color:var(--transit);line-height:1.5}
.transit-icon{flex-shrink:0}
.note-box{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.7;margin-top:10px}
.note-box b{color:var(--accent)}
.footer-note{text-align:center;font-size:11px;color:var(--sub);padding:18px 16px 4px}
.shop-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;position:relative}
.shop-cb{position:absolute;opacity:0;pointer-events:none}
.shop-cb:checked + .shop-check{background:var(--accent);border-color:var(--accent)}
.shop-cb:checked + .shop-check::after{content:"✓";color:#fff;font-size:13px;font-weight:700;display:block;text-align:center;line-height:14px}
.shop-cb:checked ~ .shop-body .shop-name{text-decoration:line-through;color:var(--sub)}
.shop-check{width:18px;height:18px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;margin-top:2px}
.shop-body{flex:1;display:block}
.shop-name{font-size:14px;font-weight:700;display:block}
.shop-note{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5;display:block}
.shop-where{display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-bg);border-radius:10px;padding:2px 8px;margin-top:6px}
.shop-section{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 8px;text-transform:uppercase;letter-spacing:0.5px}
.shop-section:first-child{margin-top:0}
</style>
</head>

const tabsEl = document.getElementById('dayTabs');
const panelsEl = document.getElementById('dayPanels');

days.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0 ? ' active' : '');
  btn.textContent = d.label;
  btn.onclick = () => show(i);
  tabsEl.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'day-panel' + (i===0 ? ' active' : '');
  panel.id = 'panel-' + i;

  const mealCell = (label, m) => `<div class="meal-cell${m.pending ? ' pending' : ''}">
      <div class="meal-label">${label}${m.pending ? ' 🔸' : ' ✅'}</div>
      <div class="meal-value">${m.text}</div>
    </div>`;

  let mealGridHTML = `<div class="meal-grid">
      ${mealCell('早餐', d.meals.b)}
      ${mealCell('午餐', d.meals.l)}
      ${mealCell('晚餐', d.meals.d)}
    </div>`;

  let itemsHTML = d.items.map(it => {
    if (it.type === 'transit') {
      return `<div class="transit"><span class="transit-icon">🚃</span><span>${it.text}</span></div>`;
    }
    const q = encodeURIComponent(it.name.replace(/[\(（].*?[\)）]/g,'').trim());
    return `<div class="stop">
      <div class="stop-top">
        <div class="stop-name">${it.name}</div>
        ${it.time ? `<div class="stop-time">${it.time}</div>` : ''}
      </div>
      <div class="stop-blurb">${it.blurb}</div>
      <div class="stop-actions"><a class="map-btn" href="https://maps.google.com/?q=${q}" target="_blank" rel="noopener">📍 地圖</a></div>
    </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="day-title">${d.title}</div>
    <div class="day-sub">${d.sub}</div>
    ${mealGridHTML}
    ${itemsHTML}
    ${i===3 ? `<div class="note-box"><b>票券提醒</b>今天會在江之電沿線多站上下車,建議在鎌倉站現場加買「江ノ電一日券(のりおりくん)」比較划算。</div>` : ''}
    ${i===6 ? `<div class="note-box"><b>交通提醒</b>全程建議用 Suica / Welcome Suica 逐次扣款,不需額外買周遊券,唯獨Day4鎌倉江之島可視情況加買江之電一日券。</div>` : ''}
  `;
  panelsEl.appendChild(panel);
});

function loadChecks(key){
  try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch(e){ return {}; }
}
function saveChecks(key, obj){
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e){}
}

  tabsEl.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'day-panel';
  panel.id = 'panel-' + id;
  let html = `<div class="day-title">${title}</div><div class="day-sub">${sub}</div>`;
  let n = 0;
  sections.forEach(sec => {
    html += `<div class="shop-section">${sec.section}</div>`;
    sec.items.forEach(it => {
      const item = (typeof it === 'string') ? {name: it, note: '', where: ''} : it;
      const cid = 'c' + (n++);
      html += `<label class="shop-item" data-key="${cid}">
        <input type="checkbox" class="shop-cb" data-cid="${cid}"${checks[cid] ? ' checked' : ''}>
        <span class="shop-check"></span>
        <span class="shop-body">
          <span class="shop-name">${item.name}</span>
          ${item.note ? `<span class="shop-note">${item.note}</span>` : ''}
          ${item.where ? `<span class="shop-where">📍 ${item.where}</span>` : ''}
        </span>
      </label>`;
    });
  });
  panel.innerHTML = html;
  panel.querySelectorAll('.shop-cb').forEach(cb => {
    cb.addEventListener('change', () => {
      checks[cb.dataset.cid] = cb.checked;
      saveChecks(key, checks);
    });
  });
  panelsEl.appendChild(panel);
  btn.onclick = () => {
    document.querySelectorAll('.day-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    panel.classList.add('active');
    btn.classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  };
}

addChecklistTab('shop', '🛍️ 購物清單', '購物清單', '想到什麼就加進來,逛街時對照打勾', shoppingList);
addChecklistTab('pack', '🧳 行李清單', '行李清單', '出發前打包時逐項打勾', packingList);

function show(i){
  document.querySelectorAll('.day-panel').forEach((p,j)=>p.classList.toggle('active', j===i));
  document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active', j===i));
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
